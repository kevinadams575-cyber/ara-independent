<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ara</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #f0d78c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #ara-header { padding: 16px 20px; border-bottom: 1px solid #2a2a2a; font-size: 18px; font-weight: 600; letter-spacing: 2px; }
  #ara-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1f1a0d; border: 1px solid #3d3420; }
  .msg.assistant { align-self: flex-start; background: #121212; border: 1px solid #2a2a2a; }
  #ara-notice, #ara-paywall { display: none; padding: 12px 20px; text-align: center; font-size: 13px; }
  #ara-notice { background: #1a1400; color: #f0d78c; border-top: 1px solid #3d3420; }
  #ara-paywall { background: #1a0000; color: #ff6b6b; border-top: 1px solid #3d0000; }
  #ara-input-row { display: flex; border-top: 1px solid #2a2a2a; padding: 12px 16px; gap: 10px; }
  #ara-input { flex: 1; background: #121212; border: 1px solid #2a2a2a; color: #f0d78c; padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; }
  #ara-input:focus { border-color: #f0d78c; }
  #ara-send { background: #f0d78c; color: #0a0a0a; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  #ara-send:hover { background: #ffe9a0; }
</style>
</head>
<body>
  <div id="ara-header">ARA</div>
  <div id="ara-messages"></div>
  <div id="ara-notice"></div>
  <div id="ara-paywall"></div>
  <div id="ara-input-row">
    <input id="ara-input" placeholder="Talk to Ara..." autocomplete="off">
    <button id="ara-send">Send</button>
  </div>
<script src="config.js"></script>
<script src="chat.js"></script>
<script>
  const chat = new AraChat(ARA_CONFIG);
  const messages = document.getElementById('ara-messages);
  const input = document.getElementById('ara-input);
  const sendBtn = document.getElementById('ara-send);

  function addMsg(role, text) {
    const div = document.createElement('div);
    div.className = 'msg ' + role;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg('user', text);
    try {
      const reply = await chat.send(text);
      addMsg('assistant', reply);
    } catch (e) {
      addMsg('assistant', 'Error: ' + e.message);
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
